name: Gerar APK Android (MyTask)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar MyTask APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências do Capacitor
        run: npm install

      - name: Preparar arquivos web (pasta www)
        run: |
          mkdir -p www
          cp index.html style.css script.js www/

      - name: Gerar e sincronizar projeto Android nativo
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK instalável
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../MyTask.apk

      - name: Disponibilizar MyTask.apk nos Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MyTask-Android-APK
          path: MyTask.apk
          if-no-files-found: error

      - name: Anexar MyTask.apk na Release quando criar nova tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          for i in 1 2 3 4 5; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" MyTask.apk --clobber
              break
            fi
            sleep 3
          done
